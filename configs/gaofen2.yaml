model:
  scale: 4
  n_colors: 3
  n_feats: 64
  n_resgroups: 10
  n_resblocks: 20
  reduction: 16

optimizer:
  lr: 1e-4
  weight_decay: 0.0
  betas: [0.9, 0.999]

data:
  train_hr: /path/to/train/HR
  train_lr: /path/to/train/LR
  val_hr: /path/to/val/HR
  val_lr: /path/to/val/LR
  scale: 4
  batch_size: 4
  num_workers: 8
  patch_size: 192
  augment: true

trainer:
  max_epochs: 200
  precision: 32
  default_root_dir: ./runs
  grad_clip: 0.0
  log_every_n_steps: 50
  val_interval: 1
